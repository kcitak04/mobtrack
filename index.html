<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MOBTRACK</title>
<style>
:root{
  --bg:#050807;--panel:#0d1311;--panel2:#141c19;--line:#24312c;--text:#cfe6d8;--dim:#5d7268;
  --acc:#39ff88;--amber:#ffb13b;--cyan:#52d4ff;--red:#ff4d61;--mag:#ff5cf0;
  --field:#08100d;--deep:#030605;--press:#26352f;--tabon:#1d2b26;--ontext:#000;--glow:rgba(57,255,136,.16);
  --list:#060a09;--listline:#111a17;--listcur:#16302a;--trk:#12201b;--vubg:#0a110e;--master:#0a1512;
  --wk1:#e4eee8;--wk2:#b4c4bb;--bk1:#2c3833;--bk2:#090d0b;--bkdown:#1f8a4c;--keylbl:#3a4a43;--keyline:#000;
  --smp:#ffd24a;--smpbg:#2a2410;--dslempty:#3a2a36;--overlay:#050807f2;--toast:#0d1311ee;--titleglow:#39ff8866;
  --r:4px;--mono:ui-monospace,"Cascadia Mono","Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  --font:ui-monospace,"Cascadia Mono","Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root{color-scheme:dark}
#app{display:flex;flex-direction:column;height:100%;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.bar{display:flex;gap:3px;align-items:stretch;flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
#top{height:46px;padding:3px;background:var(--panel);border-bottom:1px solid var(--line);touch-action:none}
/* independent scroll bar for the top bar (swiping the buttons never scrolls, so no accidental presses) */
.topnav{flex:none;height:16px;position:relative;background:var(--field);border-bottom:1px solid var(--line);touch-action:none}
.topnav b{position:absolute;top:2px;bottom:2px;border:2px solid var(--acc);border-radius:var(--r);background:var(--glow);pointer-events:none}
/* typed value entry */
.vover{position:fixed;inset:0;background:#000a;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:10px 16px}
.vpop{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%;box-shadow:0 8px 30px #000}
.vpop .vl{color:var(--amber);font-weight:700;font-size:14px;letter-spacing:1px}
.vin{font:700 20px var(--font);background:var(--field);color:var(--acc);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;width:150px}
.vin.bad{border-color:var(--red)}
.vpop .vh{color:var(--dim);font-size:11px;flex-basis:100%}
.vpop .vb{display:flex;gap:6px;flex-basis:100%;justify-content:flex-end}
.btn{flex:none;min-width:44px;min-height:38px;padding:0 8px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:var(--r);font:700 12px var(--font);letter-spacing:.5px;display:flex;
  align-items:center;justify-content:center;white-space:nowrap;cursor:pointer}
.btn:active,.btn.press{background:var(--press)}
.btn.on{background:var(--acc);color:var(--ontext);border-color:var(--acc)}
.btn.rec.on{background:var(--red);border-color:var(--red);color:#fff}
.btn.tab{color:var(--dim)} .btn.tab.on{background:var(--tabon);color:var(--acc);border-color:var(--acc)}
.btn.amber{color:var(--amber)} .btn.cyan{color:var(--cyan)} .btn.red{color:var(--red)}
.btn.dis{opacity:.35;pointer-events:none}
.sep{width:1px;background:var(--line);margin:2px;flex:none}
.num{flex:none;min-width:66px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;touch-action:none;position:relative}
.num .l{font-size:9px;color:var(--dim);letter-spacing:1px}
.num .v{font-size:15px;font-weight:700;color:var(--acc)}
.num::before,.num::after{content:'\2039';position:absolute;left:3px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
.num::after{content:'\203A';left:auto;right:3px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:grid}
#view-pattern{grid-template-columns:minmax(0,1fr) 186px}
.cwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#side .hdr{display:grid;grid-template-columns:40px 1fr 40px;gap:3px;padding:4px 4px 0}
#side .hdr .btn{min-width:0;padding:0 4px;overflow:hidden}
#side .pages{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px}
#side .hdr .btn,#side .pages .btn{min-height:34px}
#side .content{flex:1;overflow-y:auto;padding:0 4px 4px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;align-content:start;touch-action:pan-y}
#side .content .btn{min-width:0;padding:0 2px;font-size:11px}
#side .content .num{min-width:0}
.span3{grid-column:span 3}
.olist{height:124px;overflow-y:auto;background:var(--list);border:1px solid var(--line);border-radius:var(--r);touch-action:pan-y}
.olist div{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;border-bottom:1px solid var(--listline)}
.olist div.cur{background:var(--listcur);color:var(--acc)}
.olist div.play::after{content:'\25B6';color:var(--acc);margin-left:auto}
.olist div span{color:var(--dim)}
#pad{flex:none;height:116px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:4px;padding:4px}
#pad.hidden{display:none}
.padctl{display:grid;grid-template-columns:repeat(4,44px);grid-template-rows:1fr 1fr;gap:4px;flex:none}
.padctl .btn{min-width:0;padding:0}
.piano{flex:1;position:relative;min-width:0;touch-action:none}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(var(--wk1),var(--wk2));border:1px solid var(--keyline);border-radius:0 0 5px 5px}
.bk{position:absolute;top:0;height:58%;background:linear-gradient(var(--bk1),var(--bk2));border:1px solid var(--keyline);border-radius:0 0 4px 4px;z-index:2}
.wk.down{background:var(--acc)} .bk.down{background:var(--bkdown)}
.wk span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--keylbl)}
.hexpad{flex:1;display:grid;grid-template-columns:repeat(8,1fr) repeat(4,1.15fr);grid-template-rows:1fr 1fr;gap:4px}
.hexpad .btn{font-size:17px;min-width:0;padding:0}
.hexpad .d{color:var(--acc)}
.hexpad .n{font-size:13px}
#view-instr{grid-template-rows:44px minmax(50px,1fr) 44px 66px}
#view-instr>.bar{padding:3px;background:var(--panel)}
#ibar{border-bottom:1px solid var(--line)}
#wbar{border-top:1px solid var(--line)}
.iname{min-width:150px!important;justify-content:flex-start!important;color:var(--acc)!important}
.prow{display:flex;gap:4px;padding:4px;background:var(--panel);border-top:1px solid var(--line);min-width:0}
.prow select{flex:none;width:92px;background:var(--field);color:var(--amber);border:1px solid var(--line);border-radius:var(--r);
  font:700 13px var(--font);padding:0 6px}
.params{flex:1;display:flex;gap:4px;overflow-x:auto;min-width:0;scrollbar-width:none;touch-action:pan-x}
.params::-webkit-scrollbar{display:none}
.param{flex:none;width:86px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;
  background:var(--field);border:1px solid var(--line);border-radius:var(--r);touch-action:none;overflow:hidden}
.param .l{font-size:9px;color:var(--dim);letter-spacing:1px}
.param .v{font-size:14px;font-weight:700;color:var(--cyan)}
.param .bar2{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0f1a16}
.param .bar2 i{display:block;height:100%;background:var(--cyan);width:0}
.param.opt .v{color:var(--amber)}
.params .btn,.params .num{height:auto}
[hidden]{display:none!important}
.param{touch-action:pan-x}
.grp{display:flex;gap:3px;flex:none}
.tsel{flex:none;background:var(--field);color:var(--amber);border:1px solid var(--line);border-radius:var(--r);font:700 13px var(--font);padding:0 8px;min-height:38px}
.tsel.wide{min-width:150px}
#view-mixer,#view-file,#view-rsmp{grid-template-rows:minmax(0,1fr)}
.rsgrid{display:flex;flex-wrap:wrap;gap:6px}
.rsgrid .param{width:118px;height:58px}
.rsgrid .param.off{opacity:.35}
.rscv{width:320px;max-width:100%;height:64px;background:var(--deep);border:1px solid var(--line);border-radius:var(--r)}
.btn.big{min-height:48px;font-size:15px;padding:0 18px}
.strips{display:flex;overflow-x:auto;overflow-y:hidden;min-height:0;touch-action:pan-x}
.strip{flex:none;width:172px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:39px;gap:3px;padding:4px;
  border-right:1px solid var(--line);align-content:start;overflow-y:auto}
.strip.master{background:var(--master)}
.strip .sh{grid-column:span 2;display:flex;gap:3px;align-items:center;position:relative;padding-bottom:7px}
.strip .sh b{flex:1;font-size:12px;letter-spacing:1px;color:var(--acc);padding-left:4px}
.strip.fx .sh b{color:var(--amber)}
.strip.fx .mvu{display:none}
.strip .sh .btn{min-width:34px;min-height:30px;padding:0}
.btn.mute.on{background:var(--red);border-color:var(--red);color:#fff}
.strip .param{width:auto}
.mvu{position:absolute;left:4px;right:4px;bottom:0;height:5px;display:flex;flex-direction:column;gap:1px;background:var(--vubg)}
.mvu i{display:block;height:2px;background:var(--acc);width:0}
.filepane{overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.frow h3{margin:0;width:84px;font-size:11px;letter-spacing:1px;color:var(--dim)}
.fnote{color:var(--dim);font-size:11px;max-width:440px}
.tin{background:var(--field);color:var(--acc);border:1px solid var(--line);border-radius:var(--r);font:700 15px var(--font);padding:8px 10px;width:240px;text-transform:uppercase}
/* slider bars (param boxes, number boxes, dial) */
.param{justify-content:flex-start;padding-top:5px}
.param .sl{position:absolute;left:3px;right:3px;bottom:1px;height:20px;touch-action:none}
.sl .trk,.dsl .trk{position:absolute;left:6px;right:6px;top:9px;height:3px;background:var(--trk);border-radius:2px;overflow:hidden}
.sl .trk i,.dsl .trk i{display:block;height:100%;background:var(--cyan);width:0}
.sl b{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 2px var(--field)}
.sl.act b,.dsl.act b{transform:scale(1.3)}
.param.opt .sl .trk i,.param.opt .sl b{background:var(--amber)}
.num .sl{position:absolute;left:10px;right:10px;bottom:0;height:12px;touch-action:none}
.num .sl .trk{top:5px;height:2px}
.num .sl b{top:2px;width:8px;height:8px;margin-left:-4px;background:var(--acc)}
.num .sl .trk i{background:var(--acc)}
.num{padding-bottom:6px}
.padctl .num{min-width:0;padding:0 4px 6px}
/* dial pad */
.dial{flex:1;display:flex;gap:6px;min-width:0}
.dnav{display:grid;grid-template-columns:repeat(4,48px);grid-template-rows:1fr 1fr;gap:4px;flex:none}
.dnav .btn{min-width:0;padding:0;font-size:14px}
.dmain{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.dhead{display:flex;gap:6px;align-items:center;min-width:0;height:38px}
.dhead .dt{font-weight:700;color:var(--mag);font-size:14px;letter-spacing:1px;flex:none}
.dhead .tsel{max-width:46%;color:var(--mag);min-height:34px}
.dhead .dv{color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dsl{flex:1;position:relative;background:var(--field);border:1px solid var(--line);border-radius:6px;touch-action:none;min-height:40px}
.dsl .trk{left:12px;right:12px;top:calc(50% - 3px);height:6px}
.dsl .trk i{background:var(--mag)}
.dsl b{position:absolute;top:calc(50% - 13px);width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--mag);box-shadow:0 0 0 3px var(--field)}
.dsl.empty b{background:var(--dslempty)}
/* mixer: 3 columns per strip. Swiping never scrolls it (no accidental edits): move with the scroll bars */
#view-mixer{grid-template-rows:minmax(0,1fr) 36px!important}
.mixwrap{display:flex;min-height:0;min-width:0}
.strips{flex:1;overflow:auto!important;touch-action:none!important;scrollbar-width:none}
.strips::-webkit-scrollbar{display:none}
.strip{width:252px!important;grid-template-columns:1fr 1fr 1fr!important;grid-auto-rows:52px!important;overflow:visible!important}
.strip .sh{grid-column:span 3!important}
.strip .param{touch-action:none}
.vbar,.hbar{position:relative;background:var(--field);touch-action:none;flex:none}
.vbar{width:30px;border-left:1px solid var(--line)}
.hbar{border-top:1px solid var(--line)}
.vbar b,.hbar b{position:absolute;border:2px solid var(--acc);border-radius:var(--r);background:var(--glow);pointer-events:none}
.vbar b{left:3px;right:3px}
.hbar b{top:3px;bottom:3px}
.hbar .lbls{position:absolute;inset:0 30px 0 0;display:flex}
.hbar .lbls span{flex:1;text-align:center;line-height:34px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px}
.btn.dis2{opacity:.4}
.span2{grid-column:span 2}
.btn.lane{color:#ff7ad9;overflow:hidden;text-overflow:ellipsis}
.noteinfo{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--acc);border-radius:var(--r);padding:6px 8px;
  display:flex;flex-direction:column;gap:3px;max-width:260px;opacity:0;transition:opacity .35s;pointer-events:none;box-shadow:0 6px 20px #000a}
.noteinfo.show{opacity:1}
.noteinfo b{color:var(--acc);font-size:13px;white-space:nowrap}
.noteinfo span{color:var(--text);font-size:11px}
.noteinfo canvas,#pat-wrap .noteinfo canvas{position:static;inset:auto;display:block;width:220px;height:45px;border-radius:2px}
.noteinfo.fixed{position:fixed;z-index:30}
.btn.fxlbl{min-width:0;padding:0 6px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:1px}
.btn.smp{background:var(--smpbg);color:var(--smp);border-color:var(--smp)}
.dhead #kit-add{color:var(--smp);max-width:34%}
.dial.smpmode .dt{color:var(--smp)}
.dial.smpmode .dsl .trk i,.dial.smpmode .dsl b{background:var(--smp)}
.dial.swgmode .dt{color:#6fe3d0}
.dial.swgmode .dsl .trk i,.dial.swgmode .dsl b{background:#6fe3d0}
/* portrait: pattern above, tools below */
@media (orientation:portrait){
  #view-pattern{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #side{border-left:0;border-top:1px solid var(--line);max-height:34vh}
  .dnav{grid-template-columns:repeat(4,40px)}
}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--acc);
  color:var(--acc);padding:8px 14px;border-radius:var(--r);font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;
  max-width:90vw;text-align:center}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.overlay h1{margin:0;font-size:34px;letter-spacing:6px;color:var(--acc);text-shadow:0 0 18px var(--titleglow)}
.overlay p{margin:0;color:var(--dim);font-size:13px;text-align:center;max-width:80vw}
.overlay .btn{min-width:200px;min-height:56px;font-size:16px}
#help{display:none;align-items:stretch;justify-content:flex-start;padding:14px;overflow:auto;touch-action:pan-y}
#help.show{display:flex}
#help pre{margin:0;color:var(--text);font:12px/1.5 var(--font);white-space:pre-wrap}
#help b{color:var(--amber)}
#rotate{display:none}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <header id="top" class="bar"></header>
  <div id="topnav" class="topnav"><b></b></div>
  <main>
    <section id="view-pattern" class="view on">
      <div class="cwrap" id="pat-wrap"><canvas id="pat"></canvas></div>
      <aside id="side"></aside>
    </section>
    <section id="view-instr" class="view">
      <div class="bar" id="ibar"></div>
      <div class="cwrap" id="wave-wrap"><canvas id="wave"></canvas></div>
      <div class="bar" id="wbar"></div>
      <div class="prow"><select id="ipage"></select><div class="params" id="params"></div></div>
    </section>
    <section id="view-mixer" class="view">
      <div class="mixwrap"><div class="strips" id="strips"></div><div class="vbar" id="mix-vbar"><b></b></div></div>
      <div class="hbar" id="mix-hbar"><div class="lbls"></div><b></b></div>
    </section>
    <section id="view-rsmp" class="view"><div class="filepane" id="rspane"></div></section>
    <section id="view-file" class="view"><div class="filepane" id="filepane"></div></section>
  </main>
  <div id="pad"></div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*,.wav,.mp3,.ogg,.flac" hidden>
<div class="overlay" id="start">
  <h1>MOBTRACK</h1>
  <p>8-track sample tracker &middot; Web Audio / AudioWorklet</p>
  <div class="btn on" id="startbtn">TAP TO START</div>
  <div class="btn" id="restorebtn" hidden>RESTORE LAST SESSION</div>
  <p id="starterr" style="color:var(--red)"></p>
</div>
<div class="overlay" id="rotate" onclick="this.remove()"><h1>&#x21BB;</h1><p>Rotate your device to landscape.<br>(tap to dismiss)</p></div>
<div class="overlay" id="help" onclick="this.classList.remove('show')"><pre id="helptext"></pre></div>

<!-- ===================================================================
     AUDIO WORKLET SOURCE (loaded via Blob URL)
     The engine is a pure "voice renderer": it receives time-stamped events
     from the main-thread lookahead scheduler and renders them sample-accurately.
     Output i = track i (stereo) so the main-thread mixer can process tracks
     individually with native nodes (phase 3: inserts / sends).
     =================================================================== -->
<script type="text/plain" id="worklet-src">
'use strict';
const TRACKS = 8;
const PREVIEW_CHS = 4;
const NCH = TRACKS + PREVIEW_CHS;
const CR = 32;               // control-rate block size (samples)
const MAX_VOICES = 48;
const SQRT2 = Math.SQRT2;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fastTanh(x) { if (x < -3) return -1; if (x > 3) return 1; const x2 = x * x; return x * (27 + x2) / (27 + 9 * x2); }

// sample read with interpolation: 0 none (Amiga crunch), 1 linear, 2 cubic hermite
function readS(d, pos, len, interp) {
  let i = pos | 0;
  if (i >= len) i = len - 1; else if (i < 0) i = 0;
  if (interp === 0) return d[i];
  const f = pos - i, x0 = d[i], x1 = d[i + 1 < len ? i + 1 : i];
  if (interp === 1) return x0 + (x1 - x0) * f;
  const xm = d[i > 0 ? i - 1 : 0], x2 = d[i + 2 < len ? i + 2 : len - 1];
  const c = (x1 - xm) * 0.5, v = x0 - x1, w = c + v, a = w + v + (x2 - x0) * 0.5, b = w + a;
  return (((a * f) - b) * f + c) * f + x0;
}

// ADSR: linear attack, exponential decay/release. step = samples per next() call
class Env {
  constructor(step) { this.step = step || 1; this.stage = 0; this.v = 0; this.a = -1; this.locked = false; }
  set(a, d, s, r) {
    this.s = s;
    if (this.locked || (a === this.a && d === this.d && r === this.r)) return;
    this.a = a; this.d = d; this.r = r;
    const st = this.step, sr = sampleRate;
    this.aInc = st / Math.max(1, a * sr);
    this.dK = Math.exp(-4.6 * st / Math.max(1, d * sr));
    this.rK = Math.exp(-4.6 * st / Math.max(1, r * sr));
  }
  gate() { this.stage = 1; }
  release() { if (this.stage > 0 && this.stage < 4) this.stage = 4; }
  fast() { this.stage = this.v > 0 ? 4 : 0; this.locked = true; this.rK = Math.exp(-4.6 * this.step / (0.005 * sampleRate)); }
  next() {

  if (window.AndroidBridge) return toast('The app already runs full screen');
  const d = document;
  if (!d.fullscreenElement) {
    (d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen({ navigationUI: 'hide' }) : Promise.reject())
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => { });
  } else d.exitFullscreen();
}

// ---- hardware keyboard (desktop testing / BT keyboards) ----
const KEYS_LO = 'zsxdcvgbhnjm,l.;/', KEYS_HI = 'q2w3er5t6y7ui9o0p[=]';
const keyHeld = new Set();
function keyNote(k) { let i = KEYS_LO.indexOf(k); if (i >= 0) return i; i = KEYS_HI.indexOf(k); return i >= 0 ? i + 12 : -1; }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
  if (ctrl) {
    const acts = { z: () => undo.undo(), y: () => undo.redo(), c: () => copySel(false), x: () => copySel(true), v: paste };
    if (acts[k]) { e.preventDefault(); acts[k](); }
    return;
  }
  switch (e.key) {
    case 'ArrowUp': e.preventDefault(); return moveRow(-1);
    case 'ArrowDown': e.preventDefault(); return moveRow(1);
    case 'ArrowLeft': e.preventDefault(); return moveField(-1);
    case 'ArrowRight': e.preventDefault(); return moveField(1);
    case 'PageUp': e.preventDefault(); return moveRow(-16);
    case 'PageDown': e.preventDefault(); return moveRow(16);
    case 'Tab': e.preventDefault(); state.track = (state.track + (e.shiftKey ? TRACKS - 1 : 1)) % TRACKS; state.field = 0; patView.ensureVisible(); patView.dirty = true; return refreshPad();
    case ' ': e.preventDefault(); return sched.playing ? stop() : play(e.shiftKey ? 'pattern' : 'song');
    case 'Delete': case 'Backspace': e.preventDefault(); return clearField();
    case 'Insert': return insRow(false);
    case 'Escape': state.edit = !state.edit; refreshTransport(); patView.dirty = true; return;
  }
  if (e.repeat) return;
  if (state.tab === 'pattern' && state.field > 0) {
    const dg = '0123456789abcdef'.indexOf(k);
    if (dg >= 0) return enterHex(dg);
  } else {
    if (k === '1' && state.tab === 'pattern') return enterNote(NOTE_OFF);
    const s = keyNote(k);
    if (s >= 0 && !keyHeld.has(k)) {
      keyHeld.add(k); const note = state.octave * 12 + s;
      previewDown('k' + k, note);
      if (state.tab === 'pattern') enterNote(note);
    }
  }
});
document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (keyHeld.delete(k)) previewUp('k' + k); });

// =====================================================================
// 12. MAIN LOOP (playhead + meters)
// =====================================================================
function audibleTime() {
  const ctx = engine.ctx;
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  }
  return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
}
let vuActive = false, frameN = 0;
function frame() {
  requestAnimationFrame(frame);
  if (engine.ready) {
    engine.flush();
    const now = audibleTime(), q = sched.rowQueue;
    while (q.length > 1 && q[1].t <= now) q.shift();
    const cur = q.length && q[0].t <= now ? q[0] : null;
    if (cur && cur !== state.playPos) {
      const orderChanged = !state.playPos || state.playPos.order !== cur.order;
      state.playPos = cur;
      if (state.follow && sched.mode !== 'pattern' && state.order !== cur.order) { state.order = cur.order; state.row = Math.min(state.row, curPat().rows - 1); }
      if (orderChanged) renderOrderList();
      patView.dirty = true;
    }
    // automation: reflect values in the model/UI when they become audible
    while (autoPending.length && autoPending[0].t <= now) { const a = autoPending.shift(); a.r.obj[a.r.key] = a.v; autoUi = true; }
    // holding the dial slider during playback records into each row the playhead reaches
    if (dial.held && sched.playing && state.tab === 'pattern' && isDialField(state.field)) {
      const r = liveRow();
      if (r !== dial.lastRow) { dial.lastRow = r; dialWrite(dial.val, false); }
    }
    if (autoUi && (++frameN % 6 === 0)) {
      autoUi = false;
      if (state.tab === 'instr') { refreshParams(); } else if (state.tab === 'mixer') mixBoxes.forEach(b => b.refresh());
      refreshDial();
    }
    if (!sched.playing && sched.endAt != null && now >= sched.endAt) { sched.endAt = null; state.playPos = null; refreshTransport(); patView.dirty = true; }
    let any = false;
    const vd = patView.vu, vi = engine.vuIn;
    for (let i = 0; i < vd.length; i++) { vd[i] = Math.max(vd[i] * 0.86, vi[i]); vi[i] = 0; if (vd[i] > 0.003) any = true; }
    if (any || vuActive) patView.dirty = true;
    vuActive = any;
  }
  if (state.tab === 'pattern') { if (patView.dirty) patView.draw(); }
  else if (state.tab === 'instr') { if (curInst().type !== 'sampler' || waveView.dirty || engine.watchPos.length || waveView.hadPos) waveView.draw(); }
  else if (state.tab === 'mixer') updateMixerMeters();
}

// =====================================================================
// 13. HELP + BOOT
// =====================================================================
$('#helptext').innerHTML = `<b>MOBTRACK — quick reference</b>   (tap anywhere to close)

<b>PATTERN</b>  tap a cell to move the cursor · drag to scroll · track header: M = mute, S = solo
 Cell:  NOTE  INS  VOL  FX PARAM  LEN  AUTO  SWG     e.g.  C-4 01 40 A0F 04 80 20     (VIEW: FULL / NORMAL / COMPACT)
 SWG  = swing / microtiming: this row plays late by SWG/256 of a row on this track (40 = a quarter row, 80 = half).
        Dial it like LEN/AUTO; e.g. put 30-50 on every second row for a shuffle. Visible in the FULL view.
 BPM  = real tempo (4 rows = 1 beat). METRO clicks every beat (accent each 16 rows) while playing, never in exports.
 LEN  = note length in rows (note-off after N rows). The LEN box on the piano pad writes it with every new note.
 AUTO = automation value 00-FF for the track's target. On the LEN/AUTO columns the pad becomes a dial:
        drag the big slider to write the value on this row (you hear it right away); pick the target in the list.
        Hold the slider while playing (EDIT + FOLLOW) to record automation live. SEL + INTERP draws ramps.
        There are 4 automation lanes per row, each with its own target per track: the AUTO n/4 button in the
        EDIT tools switches which lane the AUTO column shows (the track type switch is the button below it).
 HOLD a note (or a sample slot) still for 1.5 s: a box shows which instrument, sample, slice and region it plays.
 The same works on the piano keys: hold a key 1.5 s to see what that key plays right now.
 Note field → piano pad (edit mode writes note + current instrument).  Other fields → hex pad.
 Hex entry: hi digit → lo digit → next row (by STEP).   OFF (===) = note-off/release, CUT (^^^) = fast cut
 SEL mode: drag to select a block → COPY/CUT/PASTE/CLEAR/transpose/INTERP (interpolates the cursor's column)
 ALL cycles: track → pattern → none.   EDIT (red) off = jam without writing.
 While playing with FOLLOW + EDIT, notes are recorded live at the playing row.

<b>TRACK TYPES</b>  EDIT page button "TRK n: SYNTH / SAMPLE" switches the cursor track (existing notes are converted, undoable).
 SYNTH track: works as before (INS column = instrument number).
 SAMPLE track (header shows SMP, gold INS column): the track has its own KIT of samples; the INS column is a kit
   SLOT. Put the cursor on it and the pad becomes the SAMPLE dial: slide to pick a slot (you hear it), it is written
   on the row. + ADD SAMPLE adds a sample from the song or LOAD A FILE; ✕ SLOT empties a slot.
   A slot without a note plays the sample at its natural pitch; add a note to pitch it. Always monophonic.

<b>EFFECTS</b> (param memory as in ProTracker; pitch slides are linear, xx/16 semitone per tick)
 0xy arpeggio        1xx porta up         2xx porta down      3xx tone porta      4xy vibrato
 5xy porta+volslide  6xy vib+volslide     7xy tremolo         8xx pan (00 L, 80 C, FF R)
 9xx sample offset (xx/256 of the sample region)   Axy vol slide (x up / y down)
 Bxx jump to order   Cxx volume (00-40)   Dxx break to row xx (hex)
 E1x/E2x fine porta  E4x vib wave  E5x finetune  E6x pattern loop  E7x trem wave  E8x pan
 E9x retrigger  EAx/EBx fine vol  ECx note cut  EDx note delay  EEx pattern delay
 Fxx speed (01-1F) / BPM (20-FF)

<b>INSTRUMENT</b>  LOAD (wav/mp3/ogg) or REC (mic).  Waveform: pinch = zoom, drag = pan (NAV) or select (SELECT)
 Drag the flags: S/E = start/end (top), LS/LE = loop (bottom).  SNAP0 snaps markers to zero crossings.
 Destructive edits act on the selection (or the whole sample); TRIM keeps selection or S..E.  UNDO per sample.
 Param boxes: drag the slider bar sideways (taps never move it), or drag the box up/down.
 Tap the middle of any value box (BPM, SPEED, params...) to TYPE a value (OK / DEFAULT / CANCEL, ± for minus);
 tap the left / right edge of a number to step - / +.  The top bar scrolls only with the thin bar under it.  In MIX only the slider bars edit; move around with the bars at the
 bottom (tap T1-T8 / MST / REV / DLY to jump) and on the right.

<b>UNDO / REDO</b> (top bar) undo everything: pattern edits, values, sample edits, presets, instruments, order list.
 WARP page: OFF = classic (pitch changes speed). BEATS = time-stretch: START..END always lasts BEATS beats at the
   song tempo (4 rows = 1 beat), notes change pitch only. MPC = old MPC-style stretch: hard-edged grains, gritty
   and stuttery (bigger GRAIN = choppier). RE-PITCH = tempo-synced by speed: faster tempo = higher pitch, like a
   record (no grain artifacts). FIT TO TEMPO guesses BEATS from the length. Follows BPM and Fxx.
 SLICE page: EQUAL or DETECT (transients) → KEYS (slice n plays at ROOT+n) or → INSTRS (one instrument per slice)

<b>SYNTHS</b>  INST tab → type selector: BASS, FM, PAD, LEAD. PRESET list, ◂ ▸, RANDOM, INIT.  POLY = max voices.
 BASS: mono. MODE LEGATO/GLIDE slides into the next note unless an OFF (===) comes first.
       Accent: notes with volume ≥ ACC.VOL (default 40) get the accent; write 30 for normal notes.
 LEAD: MONO/LEGATO glide like BASS; POLY lets notes overlap.  PAD/FM: new notes let the old one ring out.
 FM: ALGO 1-8, > = modulates, + = mixed. Operator pages OP1-OP4 (ratio, level, envelope, velocity).

<b>MIXER</b>  per track: volume, pan, reverb + delay sends, 3-band EQ, compressor and an INSERT effect:
 FILTER, DRIVE, CRUSH, CHORUS, FLANGER, PHASER, TREMOLO, AUTOPAN, RINGMOD, DELAY, REVERB, WAVEFOLD, TAPE, COMB,
 FORMANT, FREQSHIFT, GATE, WIDENER, ENVFILTER, COMP (+ FX MIX).  Master: EQ, comp, limiter.
 Every instrument (sampler and synths) also has an FX page with 2 slots of the same effects.
 Delay time is synced to BPM/speed (4 rows = 1 beat) and follows Fxx changes.

<b>RSMP</b>  resample the MASTER or one TRACK (DRY / +INSERT/EQ / +SENDS) over the PATTERN, SONG or SELECTED rows
 into a sample: TAIL keeps release/echo (0 = exact loop length), NORMALIZE, AUTO WARP (stays in tempo), LOOP,
 PUT INTO a new or the current instrument. PLAY previews it, EDIT IN INST opens it. UNDO removes it.

<b>FILE</b>  SAVE/OPEN .mtk projects (samples included) · EXPORT WAV (offline render) · IMPORT/EXPORT .MOD
 Work is autosaved in this browser; the start screen offers to restore it.

<b>KEYBOARD</b> (optional)  Z-M / Q-P piano rows · arrows · Tab track · Space play/stop · Esc edit · Ctrl+Z/Y/C/X/V`;

function boot() {
  patView = new PatternView($('#pat'));
  waveView = new WaveView($('#wave'));
  buildTop(); buildSide(); buildPad(); buildInstr(); buildFile(); buildResample(); initMixScroll(); renderMixer();
  bindHScroll($('#top'), $('#topnav'));
  // web version only: the Android app already ships all files inside the APK
  if (!window.AndroidBridge && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  refreshAll(); refreshUndoBtns();
  requestAnimationFrame(frame);
  let saved = null;
  const start = async restore => {
    try {
      await engine.init();
      if (restore && saved) { setSong(songFromObj(saved.song)); savedDirty = dirty; lastAutosave = saved.time; }
      else engine.loadSong();
      $('#start').remove();
    } catch (e) {
      $('#starterr').textContent = e.message || String(e);
    }
  };
  $('#startbtn').addEventListener('click', () => start(false));
  $('#restorebtn').addEventListener('click', () => start(true));
  idb.get('autosave').then(a => {
    if (!a || !$('#restorebtn')) return;
    saved = a; lastAutosave = a.time;
    const b = $('#restorebtn');
    b.textContent = 'RESTORE ' + (a.song.title || 'SESSION') + '  ·  ' + new Date(a.time).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    b.hidden = false;
  }).catch(() => { });
  if (location.hash === '#selftest') selfTest();
}
// dev self-test: headless Chrome with --autoplay-policy=no-user-gesture-required
async function selfTest() {
  const out = (k, v) => { document.body.dataset[k] = v; };
  try {
    out('selftest', 'init');
    await engine.init(); engine.loadSong(); $('#start').remove();
    out('selftest', 'playing');
    play('song');
    let peak = 0; const t0 = performance.now();
    await new Promise(r => { const iv = setInterval(() => { for (const v of patView.vu) peak = Math.max(peak, v); if (performance.now() - t0 > 2500) { clearInterval(iv); r(); } }, 50); });
    out('rows', String(state.playPos ? state.playPos.row : -1));
    out('peak', peak.toFixed(3));
    stop();
    out('selftest', 'done');
  } catch (e) { out('selftest', 'fail: ' + e.message); }
}
boot();
